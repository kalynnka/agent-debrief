name: Release

# release-please owns the version, the tag, the changelog and the release. Every
# push to main is offered to it; it keeps one pull request open — "chore(main):
# release x.y.z" — that accumulates every conventional commit since the last
# release, and merging that pull request is the gate. Nothing reaches a registry
# until you merge it, and the version is never typed by hand.
#
# Not `on: release: published` any more, and that is not a preference. A release
# created with the default GITHUB_TOKEN does not start another workflow, so a
# publish keyed off the release event would simply never run. The publish has to
# live in the same run that creates the release, which is why the jobs below hang
# off `release_created` rather than off an event.
#
# Cutting a release by hand in the UI therefore does nothing at all now — the same
# as pushing a tag always did.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: open or land the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Events made with the default token never start another workflow, so a
          # release pull request opened with it gets no CI run and sits there with
          # no checks. RELEASE_PLEASE_TOKEN, a fine-grained PAT with contents and
          # pull-requests write, fixes that; until the secret exists this falls
          # back to the old behaviour, where the pull request needs a manual
          # close/reopen to pick its checks up.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps package.json and, through extra-files, plugin.json — so
  # the two cannot drift and neither can the tag. This is what says that is still
  # true: it catches an extra-files entry that silently stopped matching, which is
  # a config typo away and otherwise only shows up as plugin users never being
  # offered the update. Everything downstream chains off this job, so a skip here
  # skips the whole publish.
  guard:
    name: one version in every file that carries it
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          tag="${TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $TAG says $tag; package.json says $pkg" >&2
            echo "release-please writes both — this means its config is wrong" >&2
            exit 1
          fi
          # The plugin's own version is what decides when an installed plugin is
          # offered the update, and it lives in a second file nobody looks at.
          # Drift here is silent: npm gets the new code and every plugin user
          # stays where they are.
          plugin="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$plugin" != "$pkg" ]; then
            echo ".claude-plugin/plugin.json says $plugin; package.json says $pkg" >&2
            echo "the extra-files entry in release-please-config.json is not landing" >&2
            exit 1
          fi
          echo "publishing $pkg"

  build:
    needs: [release-please, guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .vsix to the release
    steps:
      # The tag, not the branch. main may already have moved on, and what gets
      # published has to be what the release says it is.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run compile
      - run: pnpm test
      - run: pnpm run package
      # Attached to the release itself, so the .vsix somebody installs by hand is
      # the same file the registry got.
      - run: gh release upload "$TAG" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  publish-npm:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: pnpm/action-setup@v6
      # registry-url is what writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into .npmrc, and that line is the whole of the npm credential here. Every
      # step that talks to the registry has to put NPM_TOKEN in the environment for
      # it to expand to; unset, it expands to an empty string, npm reads that as
      # "auth is configured", and the failure is ENEEDAUTH.
      #
      # Node 20 like the rest of the workflow. Trusted publishing needed 24 for
      # npm >= 11.5.1; token auth has no such floor.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Symmetry with publish-vsix: say which credential is missing rather than
      # failing inside npm with a message about `npm adduser`.
      - name: the credential has to exist before this means anything
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "no NPM_TOKEN secret — nothing was published to npm." >&2
            echo "docs/RELEASING.md §3 is where this token comes from." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      # publish-vsix is downstream of this job, so a re-run after a half-failure
      # has to get past here. npm refuses a version it already has, and that
      # refusal would otherwise strand the Marketplace half for good.
      - id: registry
        name: has the registry got this version already
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # On the version string rather than the exit status. npm 11 exits 1 for a
          # version it does not have, but that has not always been true, and the way
          # this step fails wrong is by skipping every publish in silence.
          if [ -n "$(npm view "agent-debrief@$VERSION" version 2>/dev/null)" ]; then
            echo "npm already has $VERSION — skipping the publish, not failing the release"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # npm, not pnpm: .npmignore is what carves this tarball, and npm is the tool
      # that reads it the way the registry will. No --provenance: it needs
      # id-token: write and an OIDC identity, which is the path this is not on.
      - if: steps.registry.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

  # After publish-npm rather than beside it. The Marketplace PAT has a pre-flight
  # workflow of its own and the npm token has none, so the credential nobody has
  # exercised since the last release goes first: a broken one stops the release
  # before anything is public. Half-published is the state 0.1.0 spent an afternoon
  # in, and 0.1.1 hit again from the other side.
  publish-vsix:
    needs: [release-please, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: the credential has to exist before this means anything
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "no MARKETPLACE_PAT secret — nothing was published to the Marketplace." >&2
            echo "docs/RELEASING.md §2 is how to make one, including the two settings" >&2
            echo "that are the usual failures: 'All accessible organizations', and the" >&2
            echo "Marketplace > Manage scope, which the default scope set omits." >&2
            exit 1
          fi
      # Publishing the built .vsix rather than rebuilding, so what reaches the
      # Marketplace is the file the release carries.
      - run: pnpm exec vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
