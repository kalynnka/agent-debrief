name: Release

# A release you published by hand, never a tag push. Pushing v0.1.0 on its own does
# nothing; this starts when you click Publish release in GitHub's UI, which is the
# only gate between a commit and two public registries.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # The release tag and package.json are edited in different places, and a mismatch
  # publishes a version nobody named. Cheapest possible check, first.
  guard:
    name: the tag names the version being published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "release tag $GITHUB_REF_NAME says $tag; package.json says $pkg" >&2
            echo "bump one to match the other and re-run — nothing has been published" >&2
            exit 1
          fi
          # The plugin's own version is what decides when an installed plugin is
          # offered the update, and it lives in a second file nobody looks at while
          # cutting a release. Drift here is silent: npm gets the new code and every
          # plugin user stays where they are.
          plugin="$(node -p "require('./.claude-plugin/plugin.json').version")"
          if [ "$plugin" != "$pkg" ]; then
            echo ".claude-plugin/plugin.json says $plugin; package.json says $pkg" >&2
            echo "plugin users are offered an update only when that version changes" >&2
            exit 1
          fi
          echo "publishing $pkg"

  build:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run compile
      - run: pnpm test
      - run: pnpm run package
      # Attached to the release itself, so the .vsix somebody installs by hand is
      # the same file the registry got.
      - run: gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"

  # After publish-npm rather than beside it. npm is the credential that cannot be
  # checked before a release — its OIDC exchange only happens at publish, and only
  # from this workflow — while the Marketplace PAT has its own pre-flight. Putting
  # the unverifiable one first means a broken npm identity stops the release before
  # anything is public, which is exactly the state 0.1.0 ended up in.
  publish-vsix:
    needs: publish-npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: the credential has to exist before this means anything
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "no MARKETPLACE_PAT secret — nothing was published to the Marketplace." >&2
            echo "docs/RELEASING.md §2 is how to make one, including the two settings" >&2
            echo "that are the usual failures: 'All accessible organizations', and the" >&2
            echo "Marketplace > Manage scope, which the default scope set omits." >&2
            exit 1
          fi
      # Publishing the built .vsix rather than rebuilding, so what reaches the
      # Marketplace is the file the release carries.
      - run: pnpm exec vsce publish --packagePath ./*.vsix
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The entire npm credential. npm trades this OIDC identity for a short-lived
      # token scoped to this one package, so there is nothing stored to leak, rotate
      # or expire. It is granted by the trusted publisher configured on npmjs.com,
      # which names this repository and this workflow file by name.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # 24 rather than the 20 the rest of the workflow uses: trusted publishing
      # needs npm >= 11.5.1 and Node 20 ships npm 10.
      #
      # And deliberately no registry-url. It writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # into .npmrc, which with no token in the environment expands to an empty
      # credential; npm reads that as "auth is already configured", skips the OIDC
      # exchange, and fails with ENEEDAUTH. actions/setup-node#1551, still open.
      # registry.npmjs.org is the default anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run compile
      # publish-vsix is downstream of this job now, so a release re-run after a
      # half-failure has to get past here. npm refuses a version it already has,
      # and that refusal would otherwise strand the Marketplace half for good.
      - id: registry
        name: has the registry got this version already
        run: |
          v="$(node -p "require('./package.json').version")"
          # On the version string rather than the exit status. npm 11 exits 1 for a
          # version it does not have, but that has not always been true, and the way
          # this step fails wrong is by skipping every publish in silence.
          if [ -n "$(npm view "agent-debrief@$v" version 2>/dev/null)" ]; then
            echo "npm already has $v — skipping the publish, not failing the release"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi
      # npm, not pnpm: .npmignore is what carves this tarball, and npm is the tool
      # that reads it the way the registry will. No --provenance either — trusted
      # publishing attests on its own, and passing it is how you get told so.
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public
