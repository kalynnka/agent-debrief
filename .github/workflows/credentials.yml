name: Credentials

# Read-only, and deliberately its own workflow rather than another trigger on
# release.yml: a workflow_dispatch there would put a publish job one misclick away.
# Nothing here publishes, packages or writes.
#
# Run it from the Actions tab before cutting a release. Both credentials are
# otherwise first exercised by the release itself, which is a bad moment to learn
# that a PAT was scoped to one organization.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  marketplace:
    name: the Marketplace PAT publishes for this publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The publisher comes from the manifest rather than being written here twice:
      # verifying a PAT against a name the release will not use proves nothing.
      - env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "no MARKETPLACE_PAT secret. docs/RELEASING.md §2." >&2
            exit 1
          fi
          publisher="$(node -p "require('./package.json').publisher")"
          echo "verifying the token against publisher '$publisher'"
          # Exits 1 on a rejected token — checked, not assumed. A failure here is
          # one of: the token expired, it was scoped to a single organization
          # rather than all (401), it lacks Marketplace > Manage (403), or the
          # publisher is not one this account owns.
          pnpm exec vsce verify-pat "$publisher"

  npm:
    name: the npm token is live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "no NPM_TOKEN secret. docs/RELEASING.md §3." >&2
            exit 1
          fi
          # whoami is the whole check: it proves the token is valid and says which
          # account it speaks for. It cannot prove publish rights on a package that
          # does not exist yet — nothing can, until the first publish.
          echo "npm authenticates as: $(npm whoami)"
