name: Credentials

# Read-only, and deliberately its own workflow rather than another trigger on
# release.yml: a workflow_dispatch there would put a publish job one misclick away.
# Nothing here publishes, packages or writes.
#
# Run it from the Actions tab before cutting a release. The PAT is otherwise first
# exercised by the release itself, which is a bad moment to learn it was scoped to
# one organization.
#
# There is no npm job, and that is not an omission. npm holds no secret: the
# release proves its identity with an OIDC token, and the registry only accepts
# that exchange from release.yml, which the trusted publisher names by filename.
# Asking from here would be refused however healthy the real thing is, so the
# release's own npm publish is where that credential is tested — which is why
# publish-vsix now waits on it.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  marketplace:
    name: the Marketplace PAT publishes for this publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The publisher comes from the manifest rather than being written here twice:
      # verifying a PAT against a name the release will not use proves nothing.
      - env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "no MARKETPLACE_PAT secret. docs/RELEASING.md §2." >&2
            exit 1
          fi
          publisher="$(node -p "require('./package.json').publisher")"
          echo "verifying the token against publisher '$publisher'"
          # Exits 1 on a rejected token — checked, not assumed. A failure here is
          # one of: the token expired, it was scoped to a single organization
          # rather than all (401), it lacks Marketplace > Manage (403), or the
          # publisher is not one this account owns.
          pnpm exec vsce verify-pat "$publisher"
